services:
  postgres:
    image: postgres:16-alpine
    container_name: itinnepal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: itinnepal
      POSTGRES_PASSWORD: itinnepal_dev_password
      POSTGRES_DB: itinnepal_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itinnepal -d itinnepal_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: itinnepal-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
